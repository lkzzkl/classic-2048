<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 770" width="520" height="770" role="img">
  <title>2048 AI 提示版游戏界面预览</title>
  <desc>2048 游戏中局界面：分数 68、最高分 72、AI 建议向右、4x4 棋盘含 8/16/4/2 等方块。</desc>
  <rect x="0" y="0" width="520" height="770" fill="#faf8ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="24" y="92" font-size="56" font-weight="700" fill="#776e65" letter-spacing="-1">2048</text>
    <text x="24" y="118" font-size="13" fill="#9a9084">经典复刻 · 带 AI 决策提示</text>

    <rect x="330" y="36" width="80" height="58" rx="8" fill="#bbada0"/>
    <text x="370" y="56" font-size="11" fill="#f9f6f2" opacity="0.85" text-anchor="middle">分数</text>
    <text x="370" y="82" font-size="22" font-weight="700" fill="#f9f6f2" text-anchor="middle">68</text>
    <rect x="418" y="36" width="78" height="58" rx="8" fill="#bbada0"/>
    <text x="457" y="56" font-size="11" fill="#f9f6f2" opacity="0.85" text-anchor="middle">最高分</text>
    <text x="457" y="82" font-size="22" font-weight="700" fill="#f9f6f2" text-anchor="middle">72</text>

    <text x="24" y="158" font-size="13" fill="#776e65">合并相同数字，凑出 2048。方向键 / WASD 操作，手机直接滑动棋盘。</text>

    <rect x="24" y="174" width="78" height="36" rx="8" fill="#8f7a66"/>
    <text x="63" y="197" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">新游戏</text>
    <rect x="110" y="174" width="78" height="36" rx="8" fill="#1d9e75"/>
    <text x="149" y="197" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">AI 提示</text>
    <rect x="196" y="174" width="86" height="36" rx="8" fill="#ffffff" stroke="rgba(119,110,101,0.25)" stroke-width="1"/>
    <text x="239" y="197" font-size="13" font-weight="600" fill="#776e65" text-anchor="middle">撤销一步</text>

    <rect x="24" y="224" width="472" height="34" rx="8" fill="#e1f5ee"/>
    <text x="38" y="246" font-size="13" font-weight="600" fill="#0f6e56">AI 建议：向右 →（启发式搜索，仅供参考）</text>

    <rect x="24" y="272" width="472" height="472" rx="10" fill="#bbada0"/>

    <g fill="#cdc0b4">
      <rect x="36" y="284" width="103" height="103" rx="5"/>
      <rect x="151" y="284" width="103" height="103" rx="5"/>
      <rect x="266" y="284" width="103" height="103" rx="5"/>
      <rect x="381" y="284" width="103" height="103" rx="5"/>
      <rect x="36" y="399" width="103" height="103" rx="5"/>
      <rect x="151" y="399" width="103" height="103" rx="5"/>
      <rect x="266" y="399" width="103" height="103" rx="5"/>
      <rect x="381" y="399" width="103" height="103" rx="5"/>
      <rect x="36" y="514" width="103" height="103" rx="5"/>
      <rect x="151" y="514" width="103" height="103" rx="5"/>
      <rect x="266" y="514" width="103" height="103" rx="5"/>
      <rect x="381" y="514" width="103" height="103" rx="5"/>
      <rect x="36" y="629" width="103" height="103" rx="5"/>
      <rect x="151" y="629" width="103" height="103" rx="5"/>
      <rect x="266" y="629" width="103" height="103" rx="5"/>
      <rect x="381" y="629" width="103" height="103" rx="5"/>
    </g>

    <g font-size="36" font-weight="700" text-anchor="middle">
      <rect x="36" y="284" width="103" height="103" rx="5" fill="#f2b179"/>
      <text x="87.5" y="351" fill="#f9f6f2">8</text>
      <rect x="151" y="284" width="103" height="103" rx="5" fill="#eee4da"/>
      <text x="202.5" y="351" fill="#776e65">2</text>
      <rect x="266" y="284" width="103" height="103" rx="5" fill="#ede0c8"/>
      <text x="317.5" y="351" fill="#776e65">4</text>

      <rect x="36" y="399" width="103" height="103" rx="5" fill="#eee4da"/>
      <text x="87.5" y="466" fill="#776e65">2</text>
      <rect x="151" y="399" width="103" height="103" rx="5" fill="#f59563"/>
      <text x="202.5" y="466" font-size="32" fill="#f9f6f2">16</text>

      <rect x="36" y="514" width="103" height="103" rx="5" fill="#ede0c8"/>
      <text x="87.5" y="581" fill="#776e65">4</text>
      <rect x="151" y="514" width="103" height="103" rx="5" fill="#ede0c8"/>
      <text x="202.5" y="581" fill="#776e65">4</text>

      <rect x="36" y="629" width="103" height="103" rx="5" fill="#eee4da"/>
      <text x="87.5" y="696" fill="#776e65">2</text>
      <rect x="266" y="629" width="103" height="103" rx="5" fill="#eee4da"/>
      <text x="317.5" y="696" fill="#776e65">2</text>
    </g>
  </g>
</svg>
